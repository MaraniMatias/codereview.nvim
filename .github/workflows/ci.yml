name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nvim-0.9
            url: https://github.com/neovim/neovim/releases/download/v0.9.5/nvim-linux64.tar.gz
            directory: nvim-linux64
          - name: nvim-stable
            url: https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz
            directory: nvim-linux-x86_64
          - name: nvim-nightly
            url: https://github.com/neovim/neovim/releases/download/nightly/nvim-linux-x86_64.tar.gz
            directory: nvim-linux-x86_64
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          luarocks --lua-version=5.1 install luacheck

      - name: Install Neovim
        run: |
          curl --fail --location --retry 3 "${{ matrix.url }}" --output /tmp/nvim.tar.gz
          tar -xzf /tmp/nvim.tar.gz -C /tmp
          echo "/tmp/${{ matrix.directory }}/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: make lint

      - name: Test
        run: make test
